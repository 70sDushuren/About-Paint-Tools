[package]
name = "manga-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MIT-licensed cross-platform sparse tiled canvas, stroke stabilization, and manga document core."

[lib]
name = "manga_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
# Zero external dependencies in v0.1 foundation for fast offline verification.
# Curated MIT/Apache-2.0/BSD-3 graphics & core crates by milestone (see docs/en/02-architecture-and-tech-stack.md):
# - v0.1: wgpu, glam, swift-bridge / uniffi
# - v0.2-v0.4: rayon, tiny-skia, fast_image_resize
# - v0.5: vello, kurbo, rstar
# - v0.6: i_overlay, parley, harfrust
# - v0.7-v0.9: rusqlite, zstd / lz4_flex, psd, moxcms
# - v1.3: gltf
