name: MangaStudioApple
options:
  bundleIdPrefix: org.aboutpainttools
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

configFiles:
  Debug: BaseSigning.xcconfig
  Release: BaseSigning.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZED_STRING_SWIFTUI_SUPPORT: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ARCHS: arm64
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  MangaStudio-iPadOS:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ABOUT_PAINT_BUNDLE_PREFIX).ipad"
        INFOPLIST_KEY_CFBundleDisplayName: "AboutPaint iPad"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save exported manga PNG artwork directly to your iPad Photos library."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
    preBuildScripts:
      - name: "Sync Rust MangaCore XCFramework (Incremental)"
        script: |
          "$SRCROOT/../../scripts/dev.sh" ensure-rust-xcode
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Frameworks/MangaCore.xcframework
        embed: false
    sources:
      - path: Shared/Sources
      - path: Shared/Resources
      - path: iPadOS

  MangaStudio-macOS-Touch:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ABOUT_PAINT_BUNDLE_PREFIX).macos"
        INFOPLIST_KEY_CFBundleDisplayName: "AboutPaint Mac"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.graphics-design"
        ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: "Sync Rust MangaCore XCFramework (Incremental)"
        script: |
          "$SRCROOT/../../scripts/dev.sh" ensure-rust-xcode
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Frameworks/MangaCore.xcframework
        embed: false
    sources:
      - path: Shared/Sources
      - path: Shared/Resources
      - path: macOS-Touch

  MangaStudio-iPhoneDuo:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ABOUT_PAINT_BUNDLE_PREFIX).iphoneduo"
        INFOPLIST_KEY_CFBundleDisplayName: "AboutPaint Duo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: "Sync Rust MangaCore XCFramework (Incremental)"
        script: |
          "$SRCROOT/../../scripts/dev.sh" ensure-rust-xcode
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Frameworks/MangaCore.xcframework
        embed: false
    sources:
      - path: Shared/Sources
      - path: Shared/Resources
      - path: iPadOS
      - path: iPhoneDuo

  MangaStudio-macOS-Tests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ABOUT_PAINT_BUNDLE_PREFIX).macos.tests"
    dependencies:
      - framework: Frameworks/MangaCore.xcframework
        embed: false
    sources:
      - path: Shared/Sources
        excludes:
          - MangaStudioApp.swift
      - path: Shared/Tests

schemes:
  MangaStudio-iPadOS:
    build:
      targets:
        MangaStudio-iPadOS: all
  MangaStudio-macOS-Touch:
    build:
      targets:
        MangaStudio-macOS-Touch: all
        MangaStudio-macOS-Tests: [test]
    test:
      targets:
        - MangaStudio-macOS-Tests
  MangaStudio-iPhoneDuo:
    build:
      targets:
        MangaStudio-iPhoneDuo: all
