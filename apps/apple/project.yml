name: MangaStudioApple
options:
  bundleIdPrefix: org.aboutpainttools
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZED_STRING_SWIFTUI_SUPPORT: NO

targets:
  MangaStudio-iPadOS:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aboutpainttools.mangastudio.ipad
        INFOPLIST_KEY_CFBundleDisplayName: "AboutPaint iPad"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "2"
    preBuildScripts:
      - name: "Sync Rust MangaCore XCFramework (Incremental)"
        script: |
          "$SRCROOT/../../scripts/dev.sh" ensure-rust-xcode
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Frameworks/MangaCore.xcframework
        embed: false
    sources:
      - path: Shared/Sources
      - path: Shared/Resources
      - path: iPadOS

  MangaStudio-macOS-Touch:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aboutpainttools.mangastudio.macos
        INFOPLIST_KEY_CFBundleDisplayName: "AboutPaint Mac"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.graphics-design"
        ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: "Sync Rust MangaCore XCFramework (Incremental)"
        script: |
          "$SRCROOT/../../scripts/dev.sh" ensure-rust-xcode
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Frameworks/MangaCore.xcframework
        embed: false
    sources:
      - path: Shared/Sources
      - path: Shared/Resources
      - path: macOS-Touch

  MangaStudio-iPhoneDuo:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aboutpainttools.mangastudio.iphoneduo
        INFOPLIST_KEY_CFBundleDisplayName: "AboutPaint Duo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: "Sync Rust MangaCore XCFramework (Incremental)"
        script: |
          "$SRCROOT/../../scripts/dev.sh" ensure-rust-xcode
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Frameworks/MangaCore.xcframework
        embed: false
    sources:
      - path: Shared/Sources
      - path: Shared/Resources
      - path: iPadOS
      - path: iPhoneDuo
