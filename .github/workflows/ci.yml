name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i18n-and-docs:
    name: 5-Language i18n & Bilingual Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run i18n and bilingual docs validator
        run: python3 scripts/i18n_check.py
      - name: Verify Apple .xcstrings and Android strings.xml are in sync
        run: python3 scripts/i18n_sync.py --check-xcstrings --check-android
      - name: Validate CPFF v1.0 SampleManga project template
        run: python3 scripts/prj_validate.py templates/SampleManga
      - name: Validate GoNext relay orders against strict allowlist
        run: python3 scripts/relay_tool.py validate

  rust-core-and-linux-shell:
    name: Rust Core Engine, C-ABI & Linux Native Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify cross-platform C-ABI header compiles cleanly
        run: gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only core/manga-core/include/manga_core.h
      - name: Run Rust workspace unit tests (manga-core + manga-linux-shell)
        run: cargo test --manifest-path core/Cargo.toml --workspace --all-targets
      - name: Verify modular Cargo feature slices (hub / canvas / novel)
        run: |
          cargo check --manifest-path core/Cargo.toml -p manga-core --no-default-features --features hub
          cargo check --manifest-path core/Cargo.toml -p manga-core --no-default-features --features canvas
          cargo check --manifest-path core/Cargo.toml -p manga-core --no-default-features --features novel
      - name: Run Linux shell headless self-check & S4 Tri-App Integration Gate
        run: |
          cargo run --manifest-path core/Cargo.toml -p manga-linux-shell -- --app manga --self-check
          cargo run --manifest-path core/Cargo.toml -p manga-linux-shell -- --integration-check
